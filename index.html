<header><h1>ドラゴンボール ゲキシン スクアドラ</h1><div class="sub">BAN → PICK｜BAN順：B → A → A → B｜PICK順：A → B → B → A → B → A → A → B</div></header>

<section id="joinScreen" class="joinScreen">

</section>

const banOrder=["B","A","A","B"];
const pickOrder=["A","B","B","A","B","A","A","B"];

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, set, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyAjaaP0wxKnmA3daMecPuaJhDtsGgSzd9w",
  authDomain:"top-squadra.firebaseapp.com",
  databaseURL:"https://top-squadra-default-rtdb.firebaseio.com",
  projectId:"top-squadra",
  storageBucket:"top-squadra.firebasestorage.app",
  messagingSenderId:"83359965720",
  appId:"1:83359965720:web:06c1fbea9c49eca550996d",
  measurementId:"G-P51WSW4J4E"
};
const firebaseApp=initializeApp(firebaseConfig);
const db=getDatabase(firebaseApp);
const roomRef=ref(db,"rooms/main");

const $=id=>document.getElementById(id);
const clientId=localStorage.getItem("topsquadra_client_id")||crypto.randomUUID();
localStorage.setItem("topsquadra_client_id",clientId);
let role=localStorage.getItem("topsquadra_role")||null;
let room={settings:{nameA:"TEAM A",nameB:"TEAM B"},draft:{bans:[],picks:[],phase:"ban",current:0},players:{}};
let suppressNameWrite=false;

function normalize(r){
  r=r||{};
  r.settings=r.settings||{};
  r.settings.nameA=r.settings.nameA||"TEAM A";
  r.settings.nameB=r.settings.nameB||"TEAM B";
  r.draft=r.draft||{};
  r.draft.bans=Array.isArray(r.draft.bans)?r.draft.bans:[];
  r.draft.picks=Array.isArray(r.draft.picks)?r.draft.picks:[];
  r.draft.phase=r.draft.phase||"ban";
  r.draft.current=Number.isInteger(r.draft.current)?r.draft.current:0;
  r.players=r.players||{};
  return r;
}

function teamName(t){return room.settings[t==="A"?"nameA":"nameB"]||`TEAM ${t}`}
function currentTeam(){return room.draft.phase==="ban"?banOrder[room.draft.current]:room.draft.phase==="pick"?pickOrder[room.draft.current]:null}
function myTurn(){return role!=="spectator"&&currentTeam()===role}
function canControl(){return myTurn()}
function updateNames(){suppressNameWrite=true;$('nameA').value=teamName("A");$('nameB').value=teamName("B");$('titleA').textContent=teamName("A");$('titleB').textContent=teamName("B");suppressNameWrite=false}
function setJoinUI(){
  const joined=!!role;
  $('joinScreen').classList.toggle('hidden',joined);
  $('app').classList.toggle('hidden',!joined);
  $('roleLabel').textContent=role==="spectator"?"👀 観戦中":`あなた：TEAM ${role}`;
  $('turnHint').textContent=myTurn()?"あなたのターンです。キャラクターを選択できます。":currentTeam()?`${teamName(currentTeam())}のターンです。`:"ドラフト完了";
  $('nameA').disabled=role!=="A"; $('nameB').disabled=role!=="B";
  $('undo').disabled=!canControl(); $('reset').disabled=!canControl();
}

async function ensureRoom(){
  const snap=await get(roomRef);
  if(!snap.exists()) await set(roomRef,room);
}

async function claimTeam(t){
  $('joinStatus').textContent=`TEAM ${t}の空きを確認中…`;
  const pRef=ref(db,`rooms/main/players/${t}`);
  const result=await runTransaction(pRef,current=>{
    const now=Date.now();
    if(!current || current.id===clientId || !current.lastSeen || now-current.lastSeen>30000){return {id:clientId,lastSeen:now};}
    return;
  });
  if(result.committed && result.snapshot.val()?.id===clientId){
    role=t; localStorage.setItem("topsquadra_role",role); setJoinUI(); render();
  }else $('joinStatus').textContent=`TEAM ${t}はすでに参加者がいます。`;
}
async function joinSpectator(){role="spectator";localStorage.setItem("topsquadra_role",role);setJoinUI();render()}
async function leaveRole(){
  if(role==="A"||role==="B"){
    const pRef=ref(db,`rooms/main/players/${role}`);
    await runTransaction(pRef,current=>current&&current.id===clientId?null:current);
  }
  role=null;localStorage.removeItem("topsquadra_role");setJoinUI();render();
}

async function touchPresence(){
  if(role==="A"||role==="B"){
    const pRef=ref(db,`rooms/main/players/${role}`);
    await runTransaction(pRef,current=>current&&current.id===clientId?{...current,lastSeen:Date.now()}:current);
  }
}

function selectChar(c){if(!canControl())return;if(room.draft.phase==="ban")doBan(c);else if(room.draft.phase==="pick")doPick(c)}
async function updateDraft(mutator){
  const dRef = ref(db,"rooms/main/draft");

  const result = await runTransaction(dRef,current=>{
    current = current || {};

    current.bans = Array.isArray(current.bans) ? current.bans : [];
    current.picks = Array.isArray(current.picks) ? current.picks : [];
    current.phase = current.phase || "ban";
    current.current = Number.isInteger(current.current) ? current.current : 0;

    const next = JSON.parse(JSON.stringify(current));

    if(!canControl()) return;

    mutator(next);

    return next;
  });

  console.log("DRAFT TRANSACTION:", result.committed, result.snapshot.val());
}
function doBan(c){
  const t = banOrder[room.draft.current];
  if(t !== role) return;

  updateDraft(d => {
    if(!Array.isArray(d.bans)) d.bans = [];

    d.bans.push({
      team: t,
      name: c.name,
      img: c.img
    });

    d.current++;

    if(d.current >= banOrder.length){
      d.phase = "pick";
      d.current = 0;
    }
  });
}
function doPick(c){
  const t = pickOrder[room.draft.current];

  if(t !== role) return;

  updateDraft(d => {
    if(!Array.isArray(d.picks)) d.picks = [];

    d.picks.push({
      team: t,
      name: c.name,
      img: c.img
    });

    // 次のPICKへ
    d.current = d.picks.length;

    // 4回すべて終わったら完了
    if(d.picks.length >= pickOrder.length){
      d.phase = "done";
      d.current = pickOrder.length - 1;
    }
  });
}
function undo(){
  if(!canControl())return;
  updateDraft(d=>{
    if(d.phase==="done"&&d.picks.length){d.picks.pop();d.phase="pick";d.current=d.picks.length;return;}
    if(d.phase==="pick"&&d.picks.length){d.picks.pop();d.current=d.picks.length;return;}
    if(d.phase==="pick"&&d.bans.length){d.bans.pop();d.phase="ban";d.current=d.bans.length;return;}
    if(d.phase==="ban"&&d.bans.length){d.bans.pop();d.current=d.bans.length-1;return;}
  })
}
function resetDraft(){if(!canControl())return;if(!confirm("BAN & PICKを最初からやり直しますか？"))return;updateDraft(d=>{d.bans=[];d.picks=[];d.phase="ban";d.current=0})}

async function writeTeamName(t,val){
  if(suppressNameWrite||role!==t)return;
  const key=t==="A"?"nameA":"nameB";
  await set(ref(db,`rooms/main/settings/${key}`),val.trim()||`TEAM ${t}`);
}

function renderTeams(){for(const t of ["A","B"]){const el=$("slots"+t);el.innerHTML="";const mine=room.draft.picks.filter(p=>p.team===t);for(let i=0;i<4;i++){const s=document.createElement("div");s.className="slot"+(mine[i]?" filled":"");if(mine[i]){const im=document.createElement("img");im.src=mine[i].img;im.title=mine[i].name;s.appendChild(im)}else s.textContent="PICK "+(i+1);el.appendChild(s)}$("team"+t).classList.toggle("active",room.draft.phase==="pick"&&pickOrder[room.draft.current]===t)}}
function renderBans(){const el=$("banSlots");el.innerHTML="";for(let i=0;i<4;i++){const s=document.createElement("div");s.className="ban-slot";if(room.draft.bans[i]){const im=document.createElement("img");im.src=room.draft.bans[i].img;im.title=room.draft.bans[i].name;s.appendChild(im)}else s.textContent="BAN "+(i+1);el.appendChild(s)}}
function renderPool(){const q=$("search").value.trim().toLowerCase(),used=new Set([...room.draft.bans,...room.draft.picks].map(p=>p.name)),pool=$("pool");pool.innerHTML="";for(const c of chars){if(!c.name.toLowerCase().includes(q))continue;const usedNow=used.has(c.name),disabled=usedNow||room.draft.phase==="done"||!canControl();const d=document.createElement("button");d.type="button";d.className="card"+(disabled?" disabled":"");const badge=usedNow?(room.draft.bans.some(b=>b.name===c.name)?"BANNED":"PICKED"):(room.draft.phase==="ban"?"BAN":"PICK");d.innerHTML=`<span class="badge">${badge}</span><img src="${c.img}" alt="${c.name}"><div class="name">${c.name}</div>`;if(!disabled)d.addEventListener("click",()=>selectChar(c));pool.appendChild(d)}$("count").textContent=`${used.size} / ${chars.length} 使用済み`}
function render(){
  updateNames();setJoinUI();renderTeams();renderBans();
  const isBan=room.draft.phase==="ban",isPick=room.draft.phase==="pick";
  $("phase").textContent=isBan?"BAN PHASE":isPick?"PICK PHASE":"DRAFT COMPLETE";$("phase").className="phase "+(isBan?"ban":isPick?"pick":"");
  $("turnLabel").textContent=isBan?"CURRENT BAN":isPick?"CURRENT PICK":"RESULT";
  const total=banOrder.length+pickOrder.length,done=room.draft.bans.length+room.draft.picks.length;
  if(room.draft.phase==="done")$("turnText").innerHTML="<strong>DRAFT COMPLETE</strong>全BAN・PICK終了";
  else {const t=currentTeam();$("turnText").innerHTML=`<strong>${teamName(t)}</strong>${done+1} / ${total}`}
  $("bar").style.width=(done/total*100)+"%";
  $("poolTitle").innerHTML=(isBan?"BAN POOL":"PICK POOL")+` <span id="count"></span>`;
  $("history").innerHTML=[...room.draft.bans.map((p,i)=>`<div>${i+1}. ${teamName(p.team)} → 🚫 ${p.name}</div>`),...room.draft.picks.map((p,i)=>`<div>${room.draft.bans.length+i+1}. ${teamName(p.team)} → PICK ${p.name}</div>`)].join("");
  document.body.classList.toggle("banMode",isBan);renderPool();
}

$("joinA").addEventListener("click",()=>claimTeam("A"));
$("joinB").addEventListener("click",()=>claimTeam("B"));
$("joinSpectator").addEventListener("click",joinSpectator);
$("leaveBtn").addEventListener("click",leaveRole);
$("nameA").addEventListener("input",e=>writeTeamName("A",e.target.value));
$("nameB").addEventListener("input",e=>writeTeamName("B",e.target.value));
$("search").addEventListener("input",renderPool);
$("undo").addEventListener("click",undo);$("reset").addEventListener("click",resetDraft);

onValue(roomRef,snap=>{room=normalize(snap.val());render()});
ensureRoom().then(()=>{setJoinUI();render();touchPresence()});
setInterval(touchPresence,10000);
</script>
</body></html>
