<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドラゴンボール ゲキシン スクアドラ｜BAN & PICK</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.screen{min-height:100vh;padding:24px}
.hidden{display:none!important}
.card{max-width:760px;margin:8vh auto 0;background:#191e28;border:1px solid #303746;border-radius:18px;padding:28px;box-shadow:0 15px 50px #0005}
h1,h2{margin-top:0}
.muted{color:#aeb6c5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.primary,.secondary,.danger{border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.primary{background:#fff;color:#111}
.secondary{background:#2a3140;color:#fff}
.danger{background:#a92d3b;color:#fff}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #3a4353;background:#0f131a;color:#fff}
.room-input{max-width:240px;letter-spacing:6px;font-size:22px;text-align:center}
#app{display:none}
.top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.room-pill{background:#202633;border:1px solid #3a4353;padding:8px 12px;border-radius:999px}
.layout{max-width:1200px;margin:18px auto;display:grid;grid-template-columns:1fr 320px 1fr;gap:16px}
.team,.center{background:#191e28;border:1px solid #303746;border-radius:16px;padding:16px}
.team h2{display:flex;justify-content:space-between}
.slot{min-height:72px;border:1px dashed #465064;border-radius:10px;margin:8px 0;padding:10px;display:flex;align-items:center;gap:10px}
.slot img,.char img{width:54px;height:54px;object-fit:cover;border-radius:8px}
.char{background:#222936;border:1px solid #394254;border-radius:10px;padding:7px;display:flex;align-items:center;gap:8px;text-align:left;color:#fff;width:100%}
.char:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:620px;overflow:auto}
.badge{font-size:12px;padding:4px 7px;border-radius:999px;background:#343d4e}
.current{padding:12px;border-radius:10px;background:#232a37;text-align:center;margin-bottom:12px}
.name-input{margin:6px 0 10px}
.search{margin-bottom:10px}
.small{font-size:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
<style>
/* Character interaction fallback */
.character-card, .char-card, [data-char], [data-character] {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.character-card.disabled, .char-card.disabled, [data-char].disabled, [data-character].disabled,
.character-card.used, .char-card.used, [data-char].used, [data-character].used {
  cursor: not-allowed;
}
</style>
</head>
<body>

<section id="roomScreen" class="screen">
  <div class="card">
    <h1>🐉 ドラゴンボール ゲキシン スクアドラ</h1>
    <h2>BAN & PICK</h2>
    <p class="muted">4桁のルームIDを作成・入力して対戦ルームへ入室します。</p>
    <div class="row">
      <button id="createBtn" class="primary">✨ 新しいルームを作成</button>
    </div>
    <hr style="border-color:#303746;margin:24px 0">
    <h3>既存のルームに参加</h3>
    <div class="row">
      <input id="roomInput" class="room-input" inputmode="numeric" maxlength="4" placeholder="0000">
      <button id="joinBtn" class="secondary">🚪 ルームに参加</button>
    </div>
    <p id="roomStatus" class="muted"></p>
  </div>
</section>

<section id="createdScreen" class="screen hidden">
  <div class="card">
    <h1>🎉 ルームを作成しました</h1>
    <p class="muted">この4桁のIDを対戦相手に伝えてください。</p>
    <div style="font-size:54px;font-weight:900;letter-spacing:12px;text-align:center;margin:25px 0" id="createdId">----</div>
    <input id="roomUrl" readonly>
    <div class="row" style="margin-top:12px">
      <button id="copyBtn" class="secondary">📋 URLをコピー</button>
      <button id="enterCreatedBtn" class="primary">▶ ルームへ入る</button>
    </div>
  </div>
</section>

<section id="roleScreen" class="screen hidden">
  <div class="card">
    <h1>ルーム <span id="roleRoomId"></span></h1>
    <p class="muted">参加するチームを選択してください。</p>
    <div class="row">
      <button id="teamABtn" class="primary">🔵 TEAM A</button>
      <button id="teamBBtn" class="primary">🔴 TEAM B</button>
      <button id="spectatorBtn" class="secondary">👀 観戦</button>
    </div>
    <p id="roleStatus" class="muted"></p>
  </div>
</section>

<main id="app">
  <div class="screen">
    <div class="top">
      <div>
        <h1 style="margin-bottom:4px">🐉 ゲキシン スクアドラ</h1>
        <div class="muted">BAN & PICK</div>
      </div>
      <div class="row">
        <span class="room-pill">ROOM <b id="roomLabel"></b></span>
        <button id="leaveBtn" class="secondary">ルーム選択へ</button>
      </div>
    </div>

    <div class="layout">
      <section class="team">
        <h2>🔵 <span id="nameA">TEAM A</span></h2>
        <input id="nameAInput" class="name-input" placeholder="TEAM A 名称">
        <div id="aBans"></div>
        <h3>PICK</h3>
        <div id="aPicks"></div>
      </section>

      <section class="center">
        <div class="current" id="currentText">読み込み中…</div>
        <input id="search" class="search" placeholder="キャラクターを検索">
        <div id="chars" class="grid"><div class="muted">キャラクターを読み込み中…</div></div>
        <div class="row" style="margin-top:12px">
          <button id="undoBtn" class="secondary">↩ 取り消し</button>
          <button id="resetBtn" class="danger">⟳ リセット</button>
        </div>
        <p id="message" class="muted small"></p>
      </section>

      <section class="team">
        <h2>🔴 <span id="nameB">TEAM B</span></h2>
        <input id="nameBInput" class="name-input" placeholder="TEAM B 名称">
        <div id="bBans"></div>
        <h3>PICK</h3>
        <div id="bPicks"></div>
      </section>
    </div>
  </div>
</main>

<script>
/*
  CSP対策版:
  Firebase SDK(gstatic)をimportせず、Realtime Database REST APIだけを使用します。
  Firebase REST APIは .json エンドポイントでGET/PUTでき、EventSourceによる
  Server-Sent Eventsも利用できます。
*/
const DB="https://top-squadra-default-rtdb.firebaseio.com";
const banOrder=["B","A","A","B"];
const pickOrder=["A","B","B","A","B","A","A","B"];

const chars=[
"ジレン:フルパワー","ゴクウブラック","ビルス","超サイヤ人孫悟空","超サイヤ人ベジータ",
"クリリン","超サイヤ人トランクス:青年期","ピッコロ","人造人間18号","魔人ブウ:善",
"ザマス","孫悟飯:幼年期","ベビー:少年体","フリーザ:第一形態","ダーブラ",
"クウラ:最終形態","スーパーウーブ","フルパワーボージャック","超サイヤ人2 カリフラ","孫悟空(ミニ)",
"セル:完全体","人造人間17号","ヒット","超サイヤ人ケール:暴走","ガンマ1号&ガンマ2号",
"超サイヤ人3 孫悟空","超サイヤ人ゴテンクス","破壊神トッポ","超サイヤ人4 ベジータ","アルティメット孫悟飯",
"伝説の超サイヤ人ブロリー","超ベジット","超サイヤ人バーダック","超サイヤ人2 ケフラ","超サイヤ人ゴッド 孫悟空",
"超サイヤ人ゴッド ベジータ","魔人ブウ:純粋","フリーザ:第四形態","孫悟空:少年期","ブルマ:少女期"
];

const $=id=>document.getElementById(id);
let roomId=null, state=null, role=null, stream=null, streamBuffer="", pollTimer=null;

function imgUrl(i){return "https://topsquadra.vercel.app/char_"+String(i+1).padStart(2,"0")+".jpg"}
function pathUrl(path){return DB+"/"+path.split("/").map(encodeURIComponent).join("/")+".json"}
function roomUrlFor(id){return location.origin+location.pathname+"?room="+id}

async function apiGet(path){
  const r=await fetch(pathUrl(path),{cache:"no-store"});
  if(!r.ok) throw new Error("GET "+r.status);
  return r.status===204?null:r.json();
}
async function apiPut(path,data){
  const r=await fetch(pathUrl(path),{
    method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)
  });
  if(!r.ok) throw new Error("PUT "+r.status+" "+await r.text());
  return r.json();
}
async function apiDelete(path){return apiPut(path,null)}

function defaultRoom(){
  return {
    settings:{nameA:"TEAM A",nameB:"TEAM B"},
    draft:{bans:[],picks:[],phase:"ban",current:0},
    players:{}
  };
}

async function ensureRoom(id){
  const existing=await apiGet("rooms/"+id);
  if(existing) return existing;
  const room=defaultRoom();
  await apiPut("rooms/"+id,room);
  return room;
}

function setRoomUrl(id){$("roomUrl").value=roomUrlFor(id)}

function showOnly(id){
  ["roomScreen","createdScreen","roleScreen"].forEach(x=>$(x).classList.add("hidden"));
  if(id) $(id).classList.remove("hidden");
  $("app").style.display=id==="app"?"block":"none";
}

function showRole(){
  showOnly("roleScreen");
  $("roleRoomId").textContent=roomId;
  $("roleStatus").textContent="";
}

async function createRoom(){
  $("roomStatus").textContent="ルームを作成中…";
  try{
    for(let i=0;i<20;i++){
      const id=String(Math.floor(1000+Math.random()*9000));
      const existing=await apiGet("rooms/"+id);
      if(!existing){
        await apiPut("rooms/"+id,defaultRoom());
        roomId=id;
        $("createdId").textContent=id;
        setRoomUrl(id);
        showOnly("createdScreen");
        $("roomStatus").textContent="";
        return;
      }
    }
    throw new Error("ID生成に失敗");
  }catch(e){
    console.error(e);
    $("roomStatus").textContent="ルーム作成に失敗しました。FirebaseのDatabase Rulesも確認してください。";
  }
}

async function joinRoom(){
  const id=$("roomInput").value.trim();
  if(!/^\d{4}$/.test(id)){
    $("roomStatus").textContent="4桁の数字を入力してください。";
    return;
  }
  $("roomStatus").textContent="ルームを確認中…";
  try{
    const data=await apiGet("rooms/"+id);
    if(!data){
      $("roomStatus").textContent="そのルームは存在しません。";
      return;
    }
    roomId=id;
    showRole();
  }catch(e){
    console.error(e);
    $("roomStatus").textContent="ルームの確認に失敗しました。";
  }
}

async function selectRole(r){
  role=r;

  const key="topsquadra_role_"+roomId;
  localStorage.setItem(key,r);

  try{
    // Firebaseから現在のルームを取得
    const latest=await apiGet("rooms/"+roomId);

    if(!latest){
      $("roleStatus").textContent=
        "ルームデータを取得できませんでした。ルームIDを確認してください。";
      return;
    }

    state=latest;

    if(!state.players){
      state.players={};
    }

    if(r==="A"||r==="B"){
      const current=state.players[r];

      if(current && current!==sessionId()){
        $("roleStatus").textContent=
          "そのチームはすでに参加者がいます。";
        return;
      }

      state.players[r]=sessionId();

      await apiPut(
        "rooms/"+roomId+"/players",
        state.players
      );
    }

    await startRoom();

  }catch(e){
    console.error("入室エラー:",e);
    $("roleStatus").textContent=
      "入室に失敗しました。もう一度お試しください。";
  }
}

function sessionId(){
  let id=sessionStorage.getItem("topsquadra_session");
  if(!id){
    id=crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random();
    sessionStorage.setItem("topsquadra_session",id);
  }
  return id;
}

async function startRoom(){
  state=await apiGet("rooms/"+roomId);
  if(!state) state=defaultRoom();
  if(!state.draft || !Array.isArray(state.draft.bans) || !Array.isArray(state.draft.picks)) state.draft={bans:[],picks:[],phase:"ban",current:0};
  showOnly("app");
  $("roomLabel").textContent=roomId;
  $("nameAInput").value=state.settings?.nameA||"TEAM A";
  $("nameBInput").value=state.settings?.nameB||"TEAM B";
  render();
  startRealtime();
}

function startRealtime(){
  if(stream){stream.close();stream=null}
  if(pollTimer) clearInterval(pollTimer);

  try{
    stream=new EventSource(pathUrl("rooms/"+roomId));
    stream.addEventListener("put",e=>{
      try{
        const msg=JSON.parse(e.data);
        applyStream(msg);
      }catch(err){console.warn(err)}
    });
    stream.addEventListener("patch",e=>{
      try{
        const msg=JSON.parse(e.data);
        applyStream(msg);
      }catch(err){console.warn(err)}
    });
    stream.onerror=()=>{
      if(stream){stream.close();stream=null}
      if(!pollTimer) pollTimer=setInterval(refresh,1200);
    };
  }catch(e){
    pollTimer=setInterval(refresh,1200);
  }
}

function applyStream(msg){
  if(msg.path==="/"){state=msg.data||defaultRoom()}
  else{
    const parts=msg.path.split("/").filter(Boolean);
    let target=state;
    for(let i=0;i<parts.length-1;i++) target=target[parts[i]]||(target[parts[i]]={});
    if(parts.length) target[parts[parts.length-1]]=msg.data;
  }
  render();
}

async function refresh(){
  try{
    const s=await apiGet("rooms/"+roomId);
    if(s){state=s; if(!state.draft) state.draft={bans:[],picks:[],phase:"ban",current:0}; render()}
  }catch(e){console.warn(e)}
}

function usedIndexes(){
  const used=[];
  (state?.draft?.bans||[]).forEach(x=>used.push(x.index));
  (state?.draft?.picks||[]).forEach(x=>used.push(x.index));
  return used;
}

function renderSlots(){
  if(!state || typeof state!=="object") state=defaultRoom();
  const d=(state.draft && typeof state.draft==="object") ? state.draft : {bans:[],picks:[],phase:"ban",current:0};
  d.bans=Array.isArray(d.bans)?d.bans:[]; d.picks=Array.isArray(d.picks)?d.picks:[];
  const make=(arr,type,team)=>{
    return arr.filter(x=>x.team===team).map(x=>{
      const i=x.index;
      return `<div class="slot"><img src="${imgUrl(i)}"><div><b>${type}</b><br>${chars[i]}<div class="small muted">#${i+1}</div></div></div>`;
    }).join("") || `<div class="slot muted">まだありません</div>`;
  };
  $("aBans").innerHTML=make(d.bans,"BAN","A");
  $("bBans").innerHTML=make(d.bans,"BAN","B");
  $("aPicks").innerHTML=make(d.picks,"PICK","A");
  $("bPicks").innerHTML=make(d.picks,"PICK","B");
}

function render(){
  if(!state)return;
  if(!state.settings) state.settings={nameA:"TEAM A",nameB:"TEAM B"};
  if(!state.draft) state.draft={bans:[],picks:[],phase:"ban",current:0};
  $("nameA").textContent=state.settings?.nameA||"TEAM A";
  $("nameB").textContent=state.settings?.nameB||"TEAM B";
  renderSlots();

  const d=state.draft||{bans:[],picks:[],phase:"ban",current:0};
  const total=d.bans.length+d.picks.length;
  const done=total>=12;
  let currentTeam=null,label="";
  if(!done && d.phase==="ban"){currentTeam=banOrder[d.current]||null;label=`BAN ${d.bans.length+1}/4`}
  else if(!done){currentTeam=pickOrder[d.current-4]||null;label=`PICK ${d.picks.length+1}/8`}
  $("currentText").innerHTML=done?`<b>🎉 DRAFT COMPLETE</b>`:`現在：<b>TEAM ${currentTeam}</b><br><span class="muted">${label}</span>`;

  const q=$("search").value.trim().toLowerCase();
  const used=usedIndexes();
  $("chars").innerHTML=chars.map((name,i)=>{
    const disabled=used.includes(i)||done||!currentTeam||(role!=="A"&&role!=="B")||(role!==currentTeam);
    return `<button class="char" data-i="${i}" ${disabled?"disabled":""}>
      <img src="${imgUrl(i)}"><span>${name}<br><span class="small muted">#${i+1}</span></span>
    </button>`;
  }).filter((_,i)=>!q||chars[i].toLowerCase().includes(q)).join("");

  $("chars").querySelectorAll("[data-i]").forEach(b=>b.addEventListener("click",()=>pickChar(+b.dataset.i)));
  $("message").textContent=
    role==="A"||role==="B"
      ? (role===currentTeam
          ? `あなたは TEAM ${role} です。キャラクターを選択できます。`
          : `あなたは TEAM ${role} です。現在は TEAM ${currentTeam} の番です。`)
      : "観戦モード";
}

async function pickChar(index){
  try{
    if(!state || !Number.isInteger(index) || index<0 || index>=chars.length)return;
    const d=(state.draft && typeof state.draft==="object") ? state.draft : {bans:[],picks:[],phase:"ban",current:0};
    d.bans=Array.isArray(d.bans)?d.bans:[]; d.picks=Array.isArray(d.picks)?d.picks:[];
    d.phase=d.phase==="pick"?"pick":"ban";
    d.current=Number.isInteger(d.current)?d.current:0;
    const total=d.bans.length+d.picks.length;
    if(total>=12){$('message').textContent="ドラフトは完了しています。";return;}
    const team=d.phase==="ban"?banOrder[d.current]:pickOrder[d.current-4];
    if(!team){$('message').textContent="手順データを確認してください。";return;}
    if(role!==team){$('message').textContent=`現在は TEAM ${team} の番です。`;return;}
    if((d.bans.concat(d.picks)).some(x=>x && Number(x.index)===index))return;

    const next=JSON.parse(JSON.stringify(d));
    if(next.phase==="ban"){
      next.bans.push({index,team});
      next.current++;
      if(next.bans.length>=4){next.phase="pick";next.current=4;}
    }else{
      next.picks.push({index,team});
      next.current++;
    }

    $('message').textContent="反映中…";
    const latest=await apiGet("rooms/"+roomId);
    const ld=latest && latest.draft ? latest.draft : {bans:[],picks:[],phase:"ban",current:0};
    if(JSON.stringify(ld)!==JSON.stringify(d)){
      state=latest; render(); $('message').textContent="他の操作が先に反映されました。"; return;
    }
    await apiPut("rooms/"+roomId+"/draft",next);
    state.draft=next;
    render();
    $('message').textContent=`${chars[index]} を ${next.phase==="pick"?"PICK":"BAN"} に反映しました。`;
  }catch(e){
    console.error("キャラ選択エラー:",e);
    $('message').textContent="反映に失敗しました。コンソールを確認してください。";
  }
}
async function undo(){
  if(!state)return;
  const d=state.draft||{bans:[],picks:[],phase:"ban",current:0};
  if(role!=="A"&&role!=="B")return;
  const all=[...d.bans.map(x=>({...x,type:"ban"})),...d.picks.map(x=>({...x,type:"pick"}))];
  if(!all.length)return;
  const last=all[all.length-1];
  if(last.team!==role)return;

  const latest=await apiGet("rooms/"+roomId);
  const nd=latest.draft;
  if(nd.bans.length){
    const lastBan=nd.bans[nd.bans.length-1];
    if(lastBan.team===role){
      nd.bans.pop();
      nd.phase="ban";
      nd.current=nd.bans.length;
      await apiPut("rooms/"+roomId+"/draft",nd);
      return;
    }
  }
  if(nd.picks.length){
    const lastPick=nd.picks[nd.picks.length-1];
    if(lastPick.team===role){
      nd.picks.pop();
      nd.phase="pick";
      nd.current=4+nd.picks.length;
      await apiPut("rooms/"+roomId+"/draft",nd);
    }
  }
}

async function resetDraft(){
  if(!confirm("このルームのドラフトをリセットしますか？"))return;
  await apiPut("rooms/"+roomId+"/draft",{bans:[],picks:[],phase:"ban",current:0});
}

async function setTeamName(team,value){
  if(role!==team)return;
  const name=value.trim()||("TEAM "+team);
  await apiPut("rooms/"+roomId+"/settings/name"+team,name);
}

$("createBtn").onclick=createRoom;
$("joinBtn").onclick=joinRoom;
$("roomInput").addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,4));
$("teamABtn").onclick=()=>selectRole("A");
$("teamBBtn").onclick=()=>selectRole("B");
$("spectatorBtn").onclick=()=>selectRole("S");
$("enterCreatedBtn").onclick=showRole;
$("copyBtn").onclick=async()=>{
  try{await navigator.clipboard.writeText($("roomUrl").value);$("copyBtn").textContent="✅ コピーしました"}
  catch(e){$("roomUrl").select();document.execCommand("copy");$("copyBtn").textContent="✅ コピーしました"}
};
$("search").oninput=render;
$("undoBtn").onclick=undo;
$("resetBtn").onclick=resetDraft;
$("nameAInput").onchange=()=>setTeamName("A",$("nameAInput").value);
$("nameBInput").onchange=()=>setTeamName("B",$("nameBInput").value);
$("leaveBtn").onclick=()=>{if(stream)stream.close();if(pollTimer)clearInterval(pollTimer);location.href=location.pathname};

(async function boot(){
  const id=new URLSearchParams(location.search).get("room");
  if(id && /^\d{4}$/.test(id)){
    try{
      const data=await apiGet("rooms/"+id);
      if(data){
        roomId=id;
        const saved=localStorage.getItem("topsquadra_role_"+roomId);
        if(saved==="A"||saved==="B"||saved==="S"){
          role=saved;
          await startRoom();
        }else showRole();
      }else{
        $("roomStatus").textContent="指定されたルームは存在しません。";
      }
    }catch(e){
      console.error(e);
      $("roomStatus").textContent="Firebaseに接続できません。";
    }
  }
})();

</script>
